name: ramper-web-prod

services:
  astro:
    # Use the pre-built image from GHCR, no local build
    # This variable is injected by the GH Actions deploy script (defaults to latest)
    image: ${DOCKER_IMAGE:-ghcr.io/${GITHUB_REPOSITORY:-alpargatagazer/ramper-web}:latest}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - LISTMONK_URL=${LISTMONK_URL:-http://listmonk:9000}
      - PUBLIC_NEWSLETTER_LIST_UUID=${PUBLIC_NEWSLETTER_LIST_UUID}
      - NEWSLETTER_TRACKING_FILE=/app/tracking/.last-newsletter.json
    volumes:
      - newsletter_tracking:/app/tracking

volumes:
  newsletter_tracking:
